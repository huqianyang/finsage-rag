[project]
name = "finsage-rag"
version = "0.1.0"
description = "FinSage 智能金融知识库（RAG）"
requires-python = ">=3.13,<3.14"
dependencies = [
  # Web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.6",
  # 流程编排
  "langgraph>=0.2",
  # 大模型（OpenAI 兼容）
  "openai>=1.55",
  # 本地模型
  "torch==2.14.1",
  "sentence-transformers>=3.3",
  # 存储
  "pymilvus>=2.5,<2.6",
  "pymongo>=4.10",
  "minio>=7.2",
  # 工具
  "httpx>=0.27",
  "mcp>=2.3",  # web_search.py 使用 2.x 的 streamable_http_client / create_mcp_http_client 接口
  "langchain-text-splitters>=0.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.uv]
package = false

# torch 使用本地下载好的 CUDA 12.6 版 wheel（官方源：https://download-r2.pytorch.org/whl/cu126/）
[tool.uv.sources]
torch = { path = "D:/ai_models/wheels/torch-2.14.1+cu126-cp313-cp313-win_amd64.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: 需要真实中间件与模型的集成测试（uv run pytest -m integration）"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py313"
